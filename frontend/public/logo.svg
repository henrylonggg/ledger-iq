<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="256" height="256" role="img" aria-label="LedgerIQ">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3047"/>
      <stop offset="1" stop-color="#08192A"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#t)"/>
  <!-- score gauge: a 300° ring, open at upper right -->
  <circle cx="20" cy="20" r="11.5" fill="none" stroke="#22D3E3" stroke-width="3.4" stroke-linecap="round"
          stroke-dasharray="60.2 12.06" transform="rotate(-15 20 20)"/>
  <!-- earnings trend rising through the gap -->
  <path d="M13.5 23 L18 18.5 L21 21.5 L29.4 12.9" fill="none" stroke="#FFFFFF" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
